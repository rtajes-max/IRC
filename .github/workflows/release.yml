name: Instaladores
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - package.json
      - build/**
      - scripts/build.mjs
permissions:
  contents: write
  actions: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La firma con SignPath solo se hace en Windows, fuera de los pull requests y cuando está
      # configurada (variable SIGNPATH_ORGANIZATION_ID). Ver docs/FIRMA.md.
      - name: Compilar sin firma
        if: ${{ !(matrix.os == 'windows-latest' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != '') }}
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Empaquetar la aplicación (antes de firmar)
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: npm run build && npx electron-builder --win --dir --publish never
      - name: Subir el ejecutable sin firmar
        id: app-sin-firmar
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-sin-firmar
          path: release/win-unpacked/Onda IRC.exe
      - name: Firmar el ejecutable (SignPath)
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: aplicacion
          github-artifact-id: ${{ steps.app-sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/firmado-app
      - name: Crear el instalador con el ejecutable firmado
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          Copy-Item "release/firmado-app/Onda IRC.exe" "release/win-unpacked/Onda IRC.exe" -Force
          npx electron-builder --win nsis zip --prepackaged release/win-unpacked --publish never
      - name: Subir el instalador sin firmar
        id: instalador-sin-firmar
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: instalador-sin-firmar
          path: release/*.exe
      - name: Firmar el instalador (SignPath)
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: instalador
          github-artifact-id: ${{ steps.instalador-sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/firmado
      - name: Sustituir el instalador por el firmado
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: Copy-Item "release/firmado/*.exe" "release/" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: onda-irc-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
