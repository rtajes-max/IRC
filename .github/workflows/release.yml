name: Instaladores
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar como versión descargable (crea la etiqueta v<versión> y adjunta los instaladores)
        type: boolean
        default: false
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - package.json
      - build/**
      - scripts/build.mjs
permissions:
  contents: write
  actions: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La firma con SignPath solo se hace en Windows, fuera de los pull requests y cuando está
      # configurada (variable SIGNPATH_ORGANIZATION_ID). Ver docs/FIRMA.md.
      - name: Compilar sin firma
        if: ${{ !(matrix.os == 'windows-latest' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != '') }}
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Empaquetar la aplicación (antes de firmar)
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: npm run build && npx electron-builder --win --dir --publish never
      - name: Subir el ejecutable sin firmar
        id: app-sin-firmar
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: app-sin-firmar
          path: release/win-unpacked/Onda IRC.exe
      - name: Firmar el ejecutable (SignPath)
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: aplicacion
          github-artifact-id: ${{ steps.app-sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/firmado-app
      - name: Crear el instalador con el ejecutable firmado
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          Copy-Item "release/firmado-app/Onda IRC.exe" "release/win-unpacked/Onda IRC.exe" -Force
          npx electron-builder --win nsis zip --prepackaged release/win-unpacked --publish never
      - name: Subir el instalador sin firmar
        id: instalador-sin-firmar
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: instalador-sin-firmar
          path: release/*.exe
      - name: Firmar el instalador (SignPath)
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: instalador
          github-artifact-id: ${{ steps.instalador-sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/firmado
      - name: Sustituir el instalador por el firmado
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: Copy-Item "release/firmado/*.exe" "release/" -Force

      - uses: actions/upload-artifact@v6
        with:
          name: onda-irc-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  # Publica una versión con los instaladores de los tres sistemas, una sola vez, cuando los tres han compilado.
  publicar:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publicar) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v6
        with:
          path: descargas
          pattern: onda-irc-*
          merge-multiple: true
      - run: ls -la descargas
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Onda IRC ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: descargas/*
